<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; max-width: 500px; margin: 0 auto; }
    h2 { text-align: center; color: #333; }
    textarea { width: 100%; min-height: 140px; font-size: 18px; padding: 14px; border-radius: 10px; border: 1px solid #ccc; box-sizing: border-box; }
    #sendBtn { width: 100%; padding: 18px; font-size: 18px; border: none; border-radius: 12px; background: #2C7BE5; color: white; margin-top: 12px; }
    #sendBtn:disabled { background: #ccc; }
    #status { text-align: center; margin-top: 14px; color: #555; min-height: 20px; }
    .hint { text-align: center; font-size: 13px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>📝 Notas a Tarea</h2>
  <textarea id="texto" placeholder="Escribí o tocá el micrófono del teclado para dictar..." autofocus></textarea>
  <div class="hint">Tip: tocá el ícono 🎤 de tu teclado para dictar</div>
  <button id="sendBtn">Enviar a Asana</button>
  <div id="status"></div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4QPf5inP2ffuj4v2VGya3BTrSHTdQonb_QB6tVSpWaLZH1UBo4-wa-u3wU-Cu7-9xWQ/exec';

    const texto = document.getElementById('texto');
    const status = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', () => {
      const val = texto.value.trim();
      if (!val) { status.textContent = 'Escribí o dictá algo primero.'; return; }
      sendBtn.disabled = true;
      status.textContent = 'Creando tarea...';

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ texto: val })
      })
        .then(r => r.json())
        .then(res => {
          if (!res.ok) throw new Error(res.error);
          status.textContent = `✅ "${res.titulo}" creada${res.fecha ? ' — vence ' + res.fecha : ''}`;
          texto.value = '';
          texto.focus();
          sendBtn.disabled = false;
        })
        .catch(err => {
          status.textContent = '❌ Error: ' + err.message;
          sendBtn.disabled = false;
        });
    });

    texto.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
